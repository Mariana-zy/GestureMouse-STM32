<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #0052b5; stroke-width: 6; }
      .blue { fill: #0052b5; }
      .blue2 { fill: #4f7ff0; }
      .pale { fill: #eef6ff; }
      .pale2 { fill: #f8fbff; }
      .line { stroke: #b7c7df; stroke-width: 2; }
      .heavy { stroke: #0052b5; stroke-width: 4; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 50px; font-weight: 700; fill: #0052b5; letter-spacing: 1px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #374151; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; }
      .cell { font-family: Arial, Helvetica, sans-serif; font-size: 23px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #374151; }
      .bold { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #111827; }
      .ok { fill: #eafbea; stroke: #22a447; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; rx: 10; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
      .green { fill: #16803a; }
      .orange { fill: #b45309; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect x="24" y="24" width="1552" height="952" class="border"/>

  <!-- Decorative circuit corners -->
  <path d="M50 115 L120 45 L265 45 L295 25" fill="none" stroke="#0052b5" stroke-width="5"/>
  <path d="M50 175 L125 100 L260 100 L295 65" fill="none" stroke="#0052b5" stroke-width="5"/>
  <path d="M1550 885 L1480 955 L1335 955 L1305 975" fill="none" stroke="#0052b5" stroke-width="5"/>
  <path d="M1550 825 L1475 900 L1340 900 L1305 935" fill="none" stroke="#0052b5" stroke-width="5"/>

  <text x="800" y="92" text-anchor="middle" class="title">COMPARACIÓN DE CONTROLADORES</text>
  <text x="800" y="130" text-anchor="middle" class="subtitle">Criterios considerados para GestureMouse STM32</text>
  <line x1="400" y1="150" x2="1200" y2="150" class="heavy"/>

  <!-- Table frame -->
  <rect x="90" y="190" width="1420" height="650" fill="#ffffff" stroke="#8fb4e8" stroke-width="3" rx="16"/>

  <!-- Header -->
  <rect x="90" y="190" width="1420" height="72" class="blue" rx="16"/>
  <rect x="90" y="240" width="1420" height="22" class="blue"/>
  <text x="250" y="236" text-anchor="middle" class="head">Parámetro</text>
  <text x="660" y="236" text-anchor="middle" class="head">STM32F030C8T6</text>
  <text x="1110" y="236" text-anchor="middle" class="head">ESP32-C6</text>

  <!-- Columns -->
  <line x1="410" y1="190" x2="410" y2="840" class="heavy"/>
  <line x1="900" y1="190" x2="900" y2="840" class="heavy"/>

  <!-- Rows backgrounds -->
  <rect x="90" y="262" width="1420" height="72" class="pale2"/>
  <rect x="90" y="406" width="1420" height="72" class="pale2"/>
  <rect x="90" y="550" width="1420" height="72" class="pale2"/>
  <rect x="90" y="694" width="1420" height="72" class="pale2"/>

  <!-- Row lines -->
  <line x1="90" y1="334" x2="1510" y2="334" class="line"/>
  <line x1="90" y1="406" x2="1510" y2="406" class="line"/>
  <line x1="90" y1="478" x2="1510" y2="478" class="line"/>
  <line x1="90" y1="550" x2="1510" y2="550" class="line"/>
  <line x1="90" y1="622" x2="1510" y2="622" class="line"/>
  <line x1="90" y1="694" x2="1510" y2="694" class="line"/>
  <line x1="90" y1="766" x2="1510" y2="766" class="line"/>

  <!-- Row 1 -->
  <text x="115" y="306" class="bold">Rol en el proyecto</text>
  <text x="435" y="293" class="cell">Controlador principal:</text>
  <text x="435" y="320" class="small">lee IMU, procesa gestos y maneja GPIO.</text>
  <text x="925" y="293" class="cell">Módulo de comunicación:</text>
  <text x="925" y="320" class="small">recibe comandos y transmite por BLE.</text>

  <!-- Row 2 -->
  <text x="115" y="378" class="bold">Comunicación con IMU</text>
  <text x="435" y="365" class="cell">SPI suficiente para 2 IMU</text>
  <text x="435" y="392" class="small">con CS independiente por sensor.</text>
  <text x="925" y="365" class="cell">También puede usar SPI,</text>
  <text x="925" y="392" class="small">pero agrega complejidad al firmware BLE.</text>

  <!-- Row 3 -->
  <text x="115" y="450" class="bold">Programación y depuración</text>
  <text x="435" y="437" class="cell">SWD con ST-Link</text>
  <text x="435" y="464" class="small">flujo claro con CubeMX y CubeIDE.</text>
  <text x="925" y="437" class="cell">USB/UART según módulo</text>
  <text x="925" y="464" class="small">requiere entorno y carga separados.</text>

  <!-- Row 4 -->
  <text x="115" y="522" class="bold">Bluetooth Low Energy</text>
  <text x="435" y="509" class="cell">No integrado</text>
  <text x="435" y="536" class="small">necesita un módulo externo para BLE.</text>
  <text x="925" y="509" class="cell">Sí integrado</text>
  <text x="925" y="536" class="small">adecuado para BLE HID tipo mouse.</text>

  <!-- Row 5 -->
  <text x="115" y="594" class="bold">Consumo y batería</text>
  <text x="435" y="581" class="cell">Menor consumo para control local</text>
  <text x="435" y="608" class="small">conveniente para lectura continua de IMU.</text>
  <text x="925" y="581" class="cell">Mayor consumo y picos de radio</text>
  <text x="925" y="608" class="small">se debe considerar en autonomía.</text>

  <!-- Row 6 -->
  <text x="115" y="666" class="bold">Complejidad del diseño</text>
  <text x="435" y="653" class="cell">Más simple para validar hardware</text>
  <text x="435" y="680" class="small">SPI, UART, GPIO, SWD y reloj controlados.</text>
  <text x="925" y="653" class="cell">Más complejo como único MCU</text>
  <text x="925" y="680" class="small">mezcla sensores, gestos y BLE en un bloque.</text>

  <!-- Row 7 -->
  <text x="115" y="738" class="bold">Herramientas de desarrollo</text>
  <text x="435" y="725" class="cell">STM32CubeMX / STM32CubeIDE</text>
  <text x="435" y="752" class="small">facilitan configurar pines, clocks y SPI.</text>
  <text x="925" y="725" class="cell">ESP-IDF / Arduino / módulo externo</text>
  <text x="925" y="752" class="small">útil para BLE, menos directo para esta etapa.</text>

  <!-- Row 8 -->
  <text x="115" y="810" class="bold">Decisión final</text>
  <rect x="435" y="786" width="390" height="38" class="ok"/>
  <text x="630" y="811" text-anchor="middle" class="tag green">Usarlo como MCU principal</text>
  <rect x="925" y="786" width="400" height="38" class="warn"/>
  <text x="1125" y="811" text-anchor="middle" class="tag orange">Usarlo como extensión BLE</text>

  <!-- Bottom conclusion -->
  <rect x="120" y="870" width="1360" height="70" class="pale" stroke="#8fb4e8" stroke-width="3" rx="14"/>
  <text x="800" y="900" text-anchor="middle" class="cell">Conclusión: el STM32F030 centraliza el control y lectura de sensores,</text>
  <text x="800" y="928" text-anchor="middle" class="cell">mientras el ESP32-C6 se reserva para comunicación inalámbrica BLE HID.</text>
</svg>
