<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
  <defs>
    <style>
      .wire{stroke:#0033cc;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sym{stroke:#0033cc;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff0b8;stroke:#8b0000;stroke-width:3}
      .txt{font-family:"Times New Roman",serif;font-size:40px;fill:#001070;font-weight:bold}
      .pin{font-family:"Times New Roman",serif;font-size:27px;fill:#111}
      .lbl{font-family:"Times New Roman",serif;font-size:24px;fill:#990000}
      .small{font-family:"Times New Roman",serif;font-size:21px;fill:#001070}
      .note{font-family:Arial,sans-serif;font-size:18px;fill:#334155}
      .warn{font-family:Arial,sans-serif;font-size:18px;fill:#b91c1c;font-weight:bold}
    </style>
  </defs>

  <rect x="15" y="15" width="1220" height="730" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="285" y="70" class="txt">Conexion correcta CAT6219-330TDGT3</text>

  <rect x="70" y="105" width="1110" height="70" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="8"/>
  <text x="95" y="132" class="warn">Primero corrige el simbolo:</text>
  <text x="315" y="132" class="note">para TSOT-23-5 usa VIN=1, GND=2, EN=3, BYP=4, VOUT=5.</text>
  <text x="315" y="158" class="note">En tu dibujo actual VIN y VOUT estan intercambiados, y EN/BYP tambien.</text>

  <!-- BAT input -->
  <text x="70" y="245" class="lbl">BAT+</text>
  <line x1="110" y1="255" x2="110" y2="320" class="wire"/>
  <line x1="110" y1="320" x2="450" y2="320" class="wire"/>
  <circle cx="110" cy="320" r="6" fill="#0033cc"/>

  <!-- input caps -->
  <line x1="190" y1="320" x2="190" y2="400" class="wire"/>
  <line x1="160" y1="400" x2="220" y2="400" class="sym"/>
  <line x1="160" y1="420" x2="220" y2="420" class="sym"/>
  <line x1="190" y1="420" x2="190" y2="590" class="wire"/>
  <text x="225" y="415" class="lbl">C?</text>
  <text x="225" y="445" class="small">10uF</text>

  <line x1="310" y1="320" x2="310" y2="400" class="wire"/>
  <line x1="280" y1="400" x2="340" y2="400" class="sym"/>
  <line x1="280" y1="420" x2="340" y2="420" class="sym"/>
  <line x1="310" y1="420" x2="310" y2="590" class="wire"/>
  <text x="345" y="415" class="lbl">C?</text>
  <text x="345" y="445" class="small">0.1uF</text>

  <!-- corrected CAT6219 symbol -->
  <rect x="500" y="245" width="305" height="245" class="box"/>
  <text x="595" y="225" class="txt" font-size="32">U?</text>
  <text x="545" y="305" class="pin">VIN</text>
  <text x="545" y="360" class="pin">EN</text>
  <text x="685" y="305" class="pin">VOUT</text>
  <text x="685" y="360" class="pin">BYP</text>
  <text x="610" y="440" class="pin">GND</text>

  <text x="482" y="305" class="pin">1</text>
  <text x="482" y="360" class="pin">3</text>
  <text x="810" y="305" class="pin">5</text>
  <text x="810" y="360" class="pin">4</text>
  <text x="650" y="525" class="pin">2</text>
  <text x="555" y="560" class="small">CAT6219-330TDGT3</text>

  <!-- VIN and EN -->
  <line x1="450" y1="320" x2="500" y2="305" class="wire"/>
  <line x1="450" y1="320" x2="470" y2="360" class="wire"/>
  <line x1="470" y1="360" x2="500" y2="360" class="wire"/>
  <circle cx="450" cy="320" r="6" fill="#0033cc"/>
  <text x="360" y="285" class="note">EN unido a BAT+ para dejar el LDO activo</text>

  <!-- output -->
  <line x1="805" y1="305" x2="1120" y2="305" class="wire"/>
  <text x="1030" y="278" class="lbl">3.3V_SYS</text>
  <text x="965" y="338" class="small">STM32 + IMUs + ESP32-C6</text>

  <!-- output caps -->
  <line x1="920" y1="305" x2="920" y2="400" class="wire"/>
  <line x1="890" y1="400" x2="950" y2="400" class="sym"/>
  <line x1="890" y1="420" x2="950" y2="420" class="sym"/>
  <line x1="920" y1="420" x2="920" y2="590" class="wire"/>
  <text x="955" y="415" class="lbl">C?</text>
  <text x="955" y="445" class="small">10uF</text>

  <line x1="1040" y1="305" x2="1040" y2="400" class="wire"/>
  <line x1="1010" y1="400" x2="1070" y2="400" class="sym"/>
  <line x1="1010" y1="420" x2="1070" y2="420" class="sym"/>
  <line x1="1040" y1="420" x2="1040" y2="590" class="wire"/>
  <text x="1075" y="415" class="lbl">C?</text>
  <text x="1075" y="445" class="small">0.1uF</text>

  <!-- BYP capacitor -->
  <line x1="805" y1="360" x2="850" y2="360" class="wire"/>
  <line x1="850" y1="360" x2="850" y2="460" class="wire"/>
  <line x1="820" y1="460" x2="880" y2="460" class="sym"/>
  <line x1="820" y1="480" x2="880" y2="480" class="sym"/>
  <line x1="850" y1="480" x2="850" y2="590" class="wire"/>
  <text x="885" y="475" class="lbl">C?</text>
  <text x="885" y="505" class="small">10nF</text>

  <!-- ground -->
  <line x1="652" y1="490" x2="652" y2="590" class="wire"/>
  <line x1="110" y1="590" x2="1090" y2="590" class="wire"/>
  <line x1="612" y1="590" x2="692" y2="590" class="wire"/>
  <line x1="627" y1="605" x2="677" y2="605" class="wire"/>
  <line x1="642" y1="620" x2="662" y2="620" class="wire"/>
  <text x="620" y="660" class="lbl">GND</text>

  <text x="80" y="710" class="note">Valores minimos del datasheet: CIN 1uF, COUT 2.2uF, CBYP 10nF opcional. Para tu PCB: 10uF + 0.1uF en entrada y salida esta bien.</text>
</svg>
