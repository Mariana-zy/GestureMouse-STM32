<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .blue { fill: #0052b5; }
      .blue2 { fill: #4f7ff0; }
      .pale { fill: #eef6ff; }
      .line { stroke: #0052b5; stroke-width: 5; fill: none; }
      .thin { stroke: #0052b5; stroke-width: 2.5; fill: none; }
      .dash { stroke: #0052b5; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
      .gray { fill: #f8fafc; stroke: #b8c4d6; stroke-width: 2; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 58px; font-weight: 700; fill: #0052b5; letter-spacing: 1px; }
      .h { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #ffffff; }
      .hblue { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #0052b5; }
      .txt { font-family: Arial, Helvetica, sans-serif; font-size: 25px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #1f2937; }
      .mini { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #374151; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #0052b5; }
      .white { fill: #ffffff; }
      .chip { fill: #053c84; stroke: #002f6c; stroke-width: 3; rx: 18; }
      .box { fill: #ffffff; stroke: #8fb4e8; stroke-width: 3; rx: 14; }
      .note { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; rx: 12; }
      .ok { fill: #eafbea; stroke: #22a447; stroke-width: 2.5; rx: 12; }
      .bad { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; rx: 12; }
      .tableText { font-family: "Times New Roman", serif; font-size: 21px; fill: #111827; }
      .tableTitle { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#0052b5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="#0052b5" stroke-width="6"/>

  <!-- Decorative circuit corners -->
  <path class="line" d="M45 110 L115 40 L260 40 L285 25"/>
  <path class="line" d="M45 170 L120 95 L255 95 L285 65"/>
  <path class="line" d="M45 230 L95 180 L95 90"/>
  <path class="thin" d="M65 125 L65 60 L105 25"/>

  <path class="line" d="M1555 790 L1485 860 L1340 860 L1315 875"/>
  <path class="line" d="M1555 730 L1480 805 L1345 805 L1315 835"/>
  <path class="line" d="M1555 670 L1505 720 L1505 810"/>
  <path class="thin" d="M1535 775 L1535 840 L1495 875"/>

  <text x="800" y="105" text-anchor="middle" class="title">DECISIONES DE DISEÑO</text>
  <line x1="470" y1="125" x2="1130" y2="125" stroke="#0052b5" stroke-width="6"/>

  <!-- Left list -->
  <polygon points="95,185 610,185 560,245 95,245" class="blue2"/>
  <text x="165" y="224" class="h">DECISIONES PRINCIPALES</text>

  <text x="105" y="300" class="txt">- SPI en lugar de I2C para las IMU</text>
  <text x="105" y="342" class="txt">- CS independiente por sensor</text>
  <text x="105" y="384" class="txt">- STM32F030 como controlador principal</text>
  <text x="105" y="426" class="txt">- ESP32-C6 dedicado a Bluetooth Low Energy</text>
  <text x="105" y="468" class="txt">- CAT6219 en lugar de AMS1117</text>
  <text x="105" y="510" class="txt">- Programación por SWD</text>
  <text x="105" y="552" class="txt">- IMU de dedo en PCB separada</text>

  <!-- Hardware block diagram -->
  <rect x="670" y="178" width="795" height="350" class="box"/>
  <text x="1067" y="212" text-anchor="middle" class="hblue">ARQUITECTURA RESULTANTE</text>

  <rect x="715" y="260" width="165" height="82" class="gray" rx="12"/>
  <text x="797" y="295" text-anchor="middle" class="label">IMU MANO</text>
  <text x="797" y="322" text-anchor="middle" class="mini">LSM6DS3TR-C</text>

  <rect x="715" y="380" width="165" height="82" class="gray" rx="12"/>
  <text x="797" y="415" text-anchor="middle" class="label">IMU DEDO</text>
  <text x="797" y="442" text-anchor="middle" class="mini">PCB externa</text>

  <rect x="965" y="290" width="190" height="130" class="chip"/>
  <text x="1060" y="340" text-anchor="middle" font-family="Arial" font-size="33" font-weight="700" fill="#ffffff">STM32F030</text>
  <text x="1060" y="375" text-anchor="middle" font-family="Arial" font-size="21" fill="#dbeafe">lectura + control</text>

  <rect x="1235" y="282" width="160" height="74" class="gray" rx="12"/>
  <text x="1315" y="315" text-anchor="middle" class="label">ESP32-C6</text>
  <text x="1315" y="340" text-anchor="middle" class="mini">BLE HID</text>

  <rect x="1235" y="395" width="160" height="74" class="gray" rx="12"/>
  <text x="1315" y="427" text-anchor="middle" class="label">PC</text>
  <text x="1315" y="452" text-anchor="middle" class="mini">mouse BLE</text>

  <rect x="965" y="455" width="190" height="48" class="pale" stroke="#8fb4e8" stroke-width="2" rx="10"/>
  <text x="1060" y="486" text-anchor="middle" class="mini">SWD: programación</text>

  <line x1="880" y1="301" x2="957" y2="330" class="thin" marker-end="url(#arrow)"/>
  <line x1="880" y1="421" x2="957" y2="383" class="thin" marker-end="url(#arrow)"/>
  <text x="915" y="283" class="mini">SPI</text>
  <text x="915" y="448" class="mini">SPI</text>

  <line x1="1155" y1="338" x2="1225" y2="322" class="thin" marker-end="url(#arrow)"/>
  <text x="1175" y="306" class="mini">UART</text>

  <line x1="1315" y1="357" x2="1315" y2="385" class="dash" marker-end="url(#arrow)"/>
  <text x="1342" y="383" class="mini">BLE</text>

  <!-- Datasheet comparison cards -->
  <rect x="105" y="620" width="625" height="190" class="bad"/>
  <text x="130" y="655" class="tableTitle">Captura datasheet: AMS1117</text>
  <text x="130" y="690" class="tableText">Dropout Voltage</text>
  <line x1="340" y1="668" x2="340" y2="760" stroke="#111827" stroke-width="2"/>
  <text x="370" y="690" class="tableText">I<tspan baseline-shift="sub" font-size="14">OUT</tspan>=100 mA</text>
  <text x="370" y="725" class="tableText">I<tspan baseline-shift="sub" font-size="14">OUT</tspan>=500 mA</text>
  <text x="370" y="760" class="tableText">I<tspan baseline-shift="sub" font-size="14">OUT</tspan>=1 A</text>
  <text x="600" y="690" class="tableText">1.00 - 1.20 V</text>
  <text x="600" y="725" class="tableText">1.05 - 1.25 V</text>
  <text x="600" y="760" class="tableText">1.20 - 1.30 V</text>
  <text x="130" y="790" class="mini">Conclusión: requiere más voltaje de entrada que una LiPo 1S puede garantizar.</text>

  <rect x="810" y="620" width="625" height="190" class="ok"/>
  <text x="835" y="655" class="tableTitle">Captura datasheet: CAT6219</text>
  <text x="835" y="695" class="tableText">V<tspan baseline-shift="sub" font-size="14">DROP</tspan>  Dropout Voltage</text>
  <line x1="1120" y1="668" x2="1120" y2="748" stroke="#111827" stroke-width="2"/>
  <text x="1145" y="695" class="tableText">I<tspan baseline-shift="sub" font-size="14">OUT</tspan>=500 mA</text>
  <text x="1330" y="695" class="tableText">300 - 500 mV</text>
  <text x="835" y="750" class="mini">Conclusión: menor caída de tensión y mejor aprovechamiento de batería.</text>
  <text x="835" y="785" class="mini">Decisión: usar CAT6219 para la regulación principal de 3.3 V.</text>

  <!-- Bottom takeaway -->
  <rect x="420" y="830" width="760" height="35" fill="#eef6ff" stroke="#8fb4e8" stroke-width="2" rx="8"/>
  <text x="800" y="854" text-anchor="middle" class="mini">Decisión central: STM32 procesa sensores, ESP32-C6 comunica por BLE, CAT6219 mejora la alimentación con batería.</text>
</svg>
